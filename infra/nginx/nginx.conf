worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # Structured JSON access-log — consumed by Filebeat → Logstash → Elasticsearch.
    # Field order is fixed; backend/elk/logstash/pipeline/dineos.conf grok matches it.
    # upstream_response_time is quoted because it can be "-" when no upstream is hit.
    log_format dineos_json escape=json
        '{"time_iso8601":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_request_id":"$request_id"}';

    access_log /var/log/nginx/access.json dineos_json;

    # Gzip for text assets and JSON API responses
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss;

    # Global proxy timeouts (overridden per-location where needed)
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    include /etc/nginx/conf.d/*.conf;
}
