map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Allow large file uploads (matched by /api/ and /uploads/)
    client_max_body_size 50m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Propagate Nginx's unique request ID so Serilog's CorrelationId matches
    # the http_x_request_id field in the Nginx access log.
    proxy_set_header X-Request-Id      $request_id;

    # REST API — preserve /api/ prefix
    location /api/ {
        proxy_pass http://api:8080/api/;
    }

    # SignalR hubs — WebSocket upgrade required
    location /hubs/ {
        proxy_pass         http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # Static file uploads served by the API
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
    }

    # Swagger UI — prefix match covers /swagger, /swagger/, /swagger/*
    location /swagger {
        proxy_pass http://api:8080/swagger;
    }

    # Next.js frontend — WS headers kept for HMR and app-level WebSockets
    location / {
        proxy_pass         http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}
