apiVersion: v1
data:
  api-overview.json: |
    {
      "title": "DineOS API Overview",
      "uid": "dineos-api-overview",
      "tags": ["dineos", "do-5"],
      "version": 1,
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Data source",
            "pluginId": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "RPS by Status Class",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum by (code) (rate(http_requests_received_total[1m]))",
              "legendFormat": "HTTP {{code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx Error Rate %",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_received_total{code=~\"5..\"}[5m])) / sum(rate(http_requests_received_total[5m]))",
              "legendFormat": "Error rate %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Request Latency — p50 / p95 / p99",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "In-Flight Requests",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "http_requests_in_progress",
              "legendFormat": "In-flight",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Orders Created (rate/s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(dineos_orders_created_total[5m])",
              "legendFormat": "orders/s",
              "refId": "A"
            }
          ]
        }
      ]
    }
  dotnet-runtime.json: |
    {
      "title": "DineOS .NET Runtime",
      "uid": "dineos-dotnet-runtime",
      "tags": ["dineos", "do-5"],
      "version": 1,
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Data source",
            "pluginId": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "GC Collection Rate (by generation)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(dotnet_collection_count_total[5m])",
              "legendFormat": "gen {{generation}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Managed Heap Size",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "dotnet_total_memory_bytes",
              "legendFormat": "Heap bytes",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "ThreadPool Queue Length",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "dotnet_threadpool_queue_length",
              "legendFormat": "Queued work items",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Exceptions / sec",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(dotnet_exceptions_total[5m])",
              "legendFormat": "exceptions/s",
              "refId": "A"
            }
          ]
        }
      ]
    }
  infrastructure.json: |
    {
      "title": "DineOS Infrastructure",
      "uid": "dineos-infrastructure",
      "tags": ["dineos", "do-5"],
      "version": 1,
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Data source",
            "pluginId": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "PostgreSQL Up",
          "description": "Requires prometheuscommunity/postgres-exporter. Enable the postgres scrape job in prometheus.yml to populate this panel.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "noValue": "No data — postgres-exporter not running" },
          "targets": [
            {
              "expr": "pg_up",
              "legendFormat": "pg_up",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "RabbitMQ Queue Depth",
          "description": "Ready messages in the order-notifications queue. Requires the rabbitmq_prometheus plugin (port 15692). Enable the rabbitmq scrape job in prometheus.yml to populate this panel.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "noValue": "No data — rabbitmq_prometheus plugin not enabled" },
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_ready{queue=\"dineos.orders.created.notifications\"}",
              "legendFormat": "Ready messages",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Redis Hit / Miss Rate",
          "description": "Requires a Redis exporter (oliver006/redis_exporter). Not yet added to docker-compose.yml.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "noValue": "No data — redis-exporter not running" },
          "targets": [
            {
              "expr": "rate(redis_keyspace_hits_total[5m])",
              "legendFormat": "hits/s",
              "refId": "A"
            },
            {
              "expr": "rate(redis_keyspace_misses_total[5m])",
              "legendFormat": "misses/s",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Root Filesystem Free %",
          "description": "Requires prom/node-exporter. Enable the node-exporter scrape job in prometheus.yml to populate this panel.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "noValue": "No data — node-exporter not running" },
          "targets": [
            {
              "expr": "100 * node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}",
              "legendFormat": "Free %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Host Memory Utilization %",
          "description": "Requires prom/node-exporter. Enable the node-exporter scrape job in prometheus.yml to populate this panel.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "noValue": "No data — node-exporter not running" },
          "targets": [
            {
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "Memory used %",
              "refId": "A"
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: dineos-grafana-dashboards
  namespace: project-06
