# ============================================================
# values.project-06.yaml — deploy to the shared school cluster
#   namespace : project-06   (life-cluster @ 159.69.213.73)
#
# Everything runs in-cluster: API + frontend + Postgres + Redis
# + RabbitMQ + Keycloak. No persistence (data is ephemeral, fine
# for a demo), no TLS, no Ingress — reached via `kubectl port-forward`.
#
# Images are built by the build-push.yml CI on every push to main
# and pushed to ghcr.io/drenzz1/ (the repo owner). The `main` tag
# always points at the latest successful build from main.
# Install / upgrade:
#   helm upgrade --install dineos deploy/helm/dineos \
#     -f deploy/helm/dineos/values.project-06.yaml -n project-06
# ============================================================

api:
  image:
    repository: ghcr.io/drenzz1/dineos-backend
    tag: main
    pullPolicy: Always
  replicaCount: 2
  # Shared uploads volume so both API replicas serve the same images
  # (local per-pod storage would split uploads → intermittent 404s).
  uploads:
    persistence:
      enabled: true
      accessMode: ReadWriteMany
      size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    ASPNETCORE_ENVIRONMENT: Development
    # Keycloak — HTTP (no TLS), in-cluster. Login uses the password grant
    # via the backend, so the browser never talks to Keycloak directly.
    # NOTE: Keycloak is served under /auth (KC_HTTP_RELATIVE_PATH below),
    # so every Keycloak URL here carries the /auth prefix.
    Keycloak__Realm: dineos
    Keycloak__GrantType: "password"
    Keycloak__RequireHttpsMetadata: "false"
    Keycloak__PublicAuthServerUrl: "http://dineos-keycloak-http/auth"
    Keycloak__AuthServerUrl: "http://dineos-keycloak-http/auth"
    Keycloak__Authority: "http://dineos-keycloak-http/auth/realms/dineos"
    Keycloak__MetadataAddress: "http://dineos-keycloak-http/auth/realms/dineos/.well-known/openid-configuration"
    # Loki/Mailhog are not deployed here; unreachable values are tolerated
    # (Serilog logs locally, email is simply not exercised in the demo).
    Loki__Uri: "http://dineos-loki:3100"
    Smtp__Host: dineos-mailhog
    Smtp__Port: "1025"
    Smtp__UseStartTls: "false"
    # CORS — must include the public origin so preflight requests are accepted.
    AllowedOrigins__0: "https://app.project-06.gjirafa.dev"
    AllowedOrigins__1: "http://localhost:3000"

    # Stripe redirect URLs — override base values (app.dineos.io) with this cluster's origin.
    # CheckoutSuccessUrl uses {CHECKOUT_SESSION_ID} so the success page can poll status.
    Stripe__CheckoutSuccessUrl: "https://app.project-06.gjirafa.dev/signup/success?session_id={CHECKOUT_SESSION_ID}"
    Stripe__CheckoutCancelUrl: "https://app.project-06.gjirafa.dev/signup/cancelled"
    Stripe__PortalReturnUrl: "https://app.project-06.gjirafa.dev/settings/billing"

    # Signup / owner onboarding — correct URL for this cluster
    Signup__FirstLoginUrl: "https://app.project-06.gjirafa.dev/first-login"

    # Demo access flow — correct login URL for this cluster
    Demo__LoginUrl: "https://app.project-06.gjirafa.dev/login"
    Demo__TenantSlug: "demo-restaurant"

frontend:
  image:
    repository: ghcr.io/drenzz1/dineos-frontend
    tag: main
    pullPolicy: Always
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    NODE_ENV: production
    # Relative path — the browser calls /api on the frontend origin, and the
    # Next.js server proxies it to API_INTERNAL_URL (see next.config.ts rewrites).
    NEXT_PUBLIC_API_URL: "/api"
    # FIX: the API Service listens on port 80 (not 8080). The chart default
    # of :8080 would make the Next.js /api proxy fail to connect.
    API_INTERNAL_URL: "http://dineos-api:80"
    NEXT_PUBLIC_KEYCLOAK_URL: "http://dineos-keycloak-http"
    NEXT_PUBLIC_KEYCLOAK_REALM: dineos
    # NEXT_DEPLOYMENT_ID is consumed by Next.js App Router at runtime (not baked into
    # the client bundle). It lets Next.js detect stale Server Action IDs from older
    # deployments and respond with a graceful full-page reload instead of 405.
    # Update this value whenever the image tag changes (or pin it to a git SHA in CI).
    NEXT_DEPLOYMENT_ID: "main"

# ── Public web deploy — app.project-06.gjirafa.dev (single-origin) ──────────
# Real web deployment. One host serves the whole product: /api, /hubs (SignalR),
# /uploads → API; / → frontend. cert-manager issues the Let's Encrypt cert into
# dineos-tls; the long proxy timeouts keep SignalR WebSocket connections alive.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - app.project-06.gjirafa.dev
  tls:
    - hosts:
        - app.project-06.gjirafa.dev
      secretName: dineos-tls
  swagger:
    enabled: false

# Dev secrets — these match the bundled Keycloak realm-export.json.
# Safe placeholder values; never use beyond a class demo.
secrets:
  create: true
  postgresPassword: "dineos_dev"
  keycloakClientSecret: "dev-client-secret-change-me"
  keycloakAdminClientSecret: "dev-admin-secret-change-me"
  jwtSigningKey: "dev-jwt-signing-key-32-chars-min!"
  smtpPassword: ""
  rabbitMqPassword: "dineos_dev"
  providerApiKeys:
    stripe: ""
    stripeWebhook: ""
    anthropic: ""
    openai: ""
    googleai: ""
  staffSessionSigningKey: "dev-staff-session-signing-key-change-me-0123456789"

# All four dependencies run in-cluster (no managed cloud services).
dependencies:
  postgres:
    enabled: true
    host: dineos-postgres
    port: 5432
    database: dineos
    username: dineos
  redis:
    enabled: true
    host: dineos-redis-master
    port: 6379
  rabbitmq:
    enabled: true
    host: dineos-rabbitmq
    port: 5672
    username: dineos
    vhost: /
  keycloak:
    enabled: true
    internalHost: dineos-keycloak
    internalPort: 8080

# ── Sub-chart overrides — passwords must match secrets.* above ──────────────
postgres:
  auth:
    password: "dineos_dev"
  primary:
    persistence:
      enabled: true
      size: 2Gi

redis:
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    replicaCount: 0

rabbitmq:
  # FIX: Bitnami relocated versioned images (Aug 2025) from docker.io/bitnami/*
  # to docker.io/bitnamilegacy/*. The chart's pinned tag no longer exists at
  # the old path → ImagePullBackOff. Point at the legacy repo.
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
  auth:
    password: "dineos_dev"
    erlangCookie: "dineos-erlang-cookie-dev"
  persistence:
    enabled: false

# ── Keycloak (codecentric sub-chart) — fixes for a real deploy ──────────────
# 1) The chart's default image is 17.0.1-legacy (WildFly), which has no
#    /opt/keycloak/bin/kc.sh — but the chart's command IS the Quarkus kc.sh.
#    Pin a modern Quarkus image (24.0.5, matching backend/docker-compose.yml).
# 2) The chart's health probes hit /auth/realms/master and /auth/ — modern
#    Keycloak serves at / by default, so we relocate it under /auth via
#    KC_HTTP_RELATIVE_PATH. This makes the existing probes pass unchanged.
keycloak:
  image:
    tag: "24.0.5"
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dineos-keycloak-admin
          key: password
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HTTP_RELATIVE_PATH
      value: /auth

# ── Observability add-ons (persisted from the live --set flags) ─────────────
# Prometheus + Uptime Kuma run in-cluster; persistence OFF (no StorageClass
# assumption). Alertmanager is ON (plumbing): the earlier crash-loop (unsupported
# --config.expand-env) is fixed — the Deployment renders the config via an
# initContainer. Alert delivery works; AI triage + Slack stay inert until an AI
# provider key and Slack__WebhookUrl are supplied (see the alertmanager block).
observability:
  prometheus:
    enabled: true
    persistence:
      enabled: false
  alertmanager:
    enabled: true
    # Closed-cluster plumbing only — no Slack/secret wired yet. The webhook is
    # reachable only inside the cluster, so it is left unauthenticated (empty
    # shared secret). To light up AI triage + Slack, set an AI provider key under
    # secrets.providerApiKeys.* and secrets.slackWebhookUrl, then (optionally)
    # create the alertmanager-slack / alertmanager-webhook Secrets and reference
    # them via slackWebhookSecretName / alertWebhookSecretName.
  uptimeKuma:
    enabled: true
    # Durable storage (Longhorn, RWO) so the admin account, monitors, and the
    # public status page survive pod restarts. Without a PVC, Kuma resets to the
    # first-run "create admin" screen on every reschedule (it was on emptyDir).
    persistence:
      enabled: true
      size: 1Gi
      storageClass: longhorn
    # ── Public status page — status.project-06.gjirafa.dev (DO-7) ───────────
    ingress:
      enabled: true
      className: nginx
      clusterIssuer: letsencrypt-prod
      host: status.project-06.gjirafa.dev
      tls:
        - hosts:
            - status.project-06.gjirafa.dev
          secretName: dineos-status-tls
  # ── ELK (Elasticsearch + Logstash + Kibana) — DO-6 centralized logging ──────
  # Enabling this auto-wires the API's Logstash__Uri (see configmap.yaml), so app
  # logs flow: API → Logstash:5001 → Elasticsearch → Kibana. Kibana stays private
  # (ingress disabled) — reach it with `kubectl port-forward`. The ES PVC size is
  # pinned here because a StatefulSet's volumeClaimTemplates are immutable once
  # created (5Gi is ample for a demo; the chart default is 20Gi).
  elk:
    enabled: true
    elasticsearch:
      persistence:
        size: 5Gi
    logstash:
      # Logstash was OOMKilled (exit 137) at the 1Gi default: its default 1g heap
      # left no headroom for non-heap memory. Run a 1g heap inside a 2Gi limit.
      javaOpts: "-Xms1g -Xmx1g"
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi
    kibana:
      ingress:
        enabled: false
      # Kibana 8.x (Node.js) OOMs at the 512Mi chart default — "Reached heap
      # limit … JavaScript heap out of memory", exit 134. Give it 1Gi to start.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
