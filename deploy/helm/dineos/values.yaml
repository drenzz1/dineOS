# ============================================================
# values.yaml — production-shaped defaults
# All secrets are placeholders; supply real values via
# --set secrets.<key>=... or a sealed-secrets / ESO overlay.
# Dependencies are OFF by default — point to managed services.
# ============================================================

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# ------------------------------------------------------------
# API (DineOS.Api — .NET 10)
# ------------------------------------------------------------
api:
  image:
    repository: dineos/api
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Non-secret env vars only.
  # Secret refs (passwords, keys) are injected from the Secret
  # produced by secrets.create=true — templates wire them via envFrom.
  env:
    ASPNETCORE_ENVIRONMENT: Production

    # Keycloak — issuer / OIDC metadata
    Keycloak__Realm: dineos
    Keycloak__Audience: dineos-api
    Keycloak__ClientId: dineos-frontend
    Keycloak__GrantType: authorization_code
    Keycloak__RequireHttpsMetadata: "true"
    Keycloak__AdminClientId: dineos-admin
    # PublicAuthServerUrl  → browser-facing Keycloak URL
    # AuthServerUrl        → in-cluster Keycloak URL for server↔Keycloak calls
    # Override both in values.local.yaml to http://... for non-TLS dev clusters.
    Keycloak__PublicAuthServerUrl: "https://auth.dineos.io"
    Keycloak__AuthServerUrl: "https://auth.dineos.io"
    Keycloak__Authority: "https://auth.dineos.io/realms/dineos"
    Keycloak__MetadataAddress: "https://auth.dineos.io/realms/dineos/.well-known/openid-configuration"

    # RabbitMQ
    RabbitMq__Enabled: "true"
    # RabbitMq__Password → Secret
    # Host/port/username are read from dependencies.rabbitmq.* by the ConfigMap template.

    # Loki (optional in prod — disable by pointing at a no-op sink)
    Loki__Uri: "http://loki:3100"
    # Logstash TCP input (ELK profile — opt-in; leave blank to disable)
    Logstash__Uri: ""

    # SMTP
    Smtp__Host: smtp.mailgun.org
    Smtp__Port: "587"
    Smtp__UseStartTls: "true"
    # Smtp__Password → Secret

    # Email
    Email__Enabled: "true"
    Email__FromAddress: no-reply@dineos.io
    Email__FromName: DineOS
    Email__SimulateFailure: "false"

    # Stripe (non-secret)
    Stripe__ProMonthlyPriceId: ""
    Stripe__ProAnnualPriceId: ""
    Stripe__CheckoutSuccessUrl: "https://app.dineos.io/settings/billing?status=success"
    Stripe__CheckoutCancelUrl: "https://app.dineos.io/settings/billing?status=cancelled"
    Stripe__PortalReturnUrl: "https://app.dineos.io/settings/billing"

    # AI providers (non-secret model selection only; keys → Secret)
    Anthropic__Model: claude-sonnet-4-5

    # CORS — list additional origins in values.local.yaml
    AllowedOrigins__0: "https://app.dineos.io"

    # Signup / owner onboarding — "set your password" link in welcome email
    Signup__FirstLoginUrl: "https://app.dineos.io/first-login"

    # Demo access flow (#216) — shared demo tenant config
    Demo__Enabled: "true"
    Demo__TenantSlug: "demo-restaurant"
    Demo__AccountTtlDays: "7"
    Demo__LoginUrl: "https://app.dineos.io/login"
    Demo__RealmRole: "Demo"
    Demo__CleanupCron: "0 3 * * *"

    # Staff session PIN flow (#216) — non-secret timing/issuer config only
    # StaffSession__SigningKey is sensitive — lives in secrets.staffSessionSigningKey
    StaffSession__Issuer: "dineos-staff-session"
    StaffSession__Audience: "dineos-api"
    StaffSession__TokenLifetimeMinutes: "60"
    StaffSession__RefreshTokenLifetimeMinutes: "720"

# ------------------------------------------------------------
# Frontend (Next.js 15 — standalone output)
# ------------------------------------------------------------
frontend:
  image:
    repository: dineos/web
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  env:
    NODE_ENV: production
    # NEXT_PUBLIC_* are baked into the JS bundle at build time;
    # they must also be set as Docker build ARGs — see frontend/Dockerfile.
    NEXT_PUBLIC_API_URL: "https://app.dineos.io/api"
    # API_INTERNAL_URL is used by Next.js server-side (SSR/RSC) to reach
    # the API without going through the ingress.
    API_INTERNAL_URL: "http://dineos-api:8080"
    NEXT_PUBLIC_KEYCLOAK_URL: "https://auth.dineos.io"
    NEXT_PUBLIC_KEYCLOAK_REALM: dineos

# ------------------------------------------------------------
# Ingress
# ------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # SignalR connections on /hubs are long-lived WebSockets; raise timeouts
    # so the nginx-ingress controller does not close idle upgrade connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # List every public hostname that should resolve to this Ingress.
  # Each host gets the full path ruleset (see ingress.yaml template).
  hosts:
    - app.dineos.io
  # Standard k8s Ingress TLS spec — one entry per cert-manager Certificate.
  # cert-manager reads the secretName and provisions the cert automatically
  # when the cluster-issuer annotation above is set.
  tls:
    - hosts:
        - app.dineos.io
      secretName: dineos-tls
  # Expose /swagger only in non-production environments.
  # Set to true in values.local.yaml or a staging overlay.
  swagger:
    enabled: false

# ------------------------------------------------------------
# Secrets
# secrets.create=true renders a Kubernetes Secret named
# <fullname>-secrets. Set to false when you manage secrets
# externally (Sealed Secrets, ESO, Vault, etc.).
# All values below are intentionally empty — fill them via
# --set or a values overlay that is never committed.
# ------------------------------------------------------------
secrets:
  create: true
  # Set existingSecret to the name of a pre-created Secret and set
  # create=false to skip chart-managed Secret generation entirely.
  existingSecret: ""

  # Postgres
  postgresPassword: ""

  # Keycloak
  keycloakClientSecret: ""        # dineos-frontend client secret
  keycloakAdminClientSecret: ""   # dineos-admin service-account secret (Keycloak__AdminClientSecret)

  # JWT
  jwtSigningKey: ""

  # SMTP
  smtpPassword: ""

  # RabbitMQ
  rabbitMqPassword: ""

  # Third-party provider API keys
  providerApiKeys:
    stripe: ""          # Stripe__SecretKey
    stripeWebhook: ""   # Stripe__WebhookSecret
    anthropic: ""       # Anthropic__ApiKey
    openai: ""          # OpenAI__ApiKey
    googleai: ""        # GoogleAI__ApiKey

  # AI incident triage (DO-12)
  alertWebhookSecret: ""  # AlertWebhook__SharedSecret — shared between Alertmanager and the API
  slackWebhookUrl: ""     # Slack__WebhookUrl — Incoming Webhook URL for triage notifications

  # Staff session PIN flow (#216) — HMAC-SHA256 key; must be ≥32 bytes
  staffSessionSigningKey: ""  # StaffSession__SigningKey

# ------------------------------------------------------------
# In-cluster dependency toggles
# enabled=false → chart skips the sub-chart / StatefulSet and
#                 workloads use the host/port values above.
# enabled=true  → chart deploys a dev-grade in-cluster instance
#                 (intended for local clusters only).
# ------------------------------------------------------------
dependencies:
  postgres:
    enabled: false
    host: postgres.example.com
    port: 5432
    database: dineos
    username: dineos

  redis:
    enabled: false
    host: redis.example.com
    port: 6379

  rabbitmq:
    enabled: false
    host: rabbitmq.example.com
    port: 5672
    username: dineos
    vhost: /

  keycloak:
    enabled: false
    # Internal cluster URL used when enabled=true (server↔Keycloak calls)
    internalHost: keycloak
    internalPort: 8080

# ============================================================
# Sub-chart configuration (only applied when the matching
# dependencies.<name>.enabled=true)
# ============================================================

# ------------------------------------------------------------
# Bitnami PostgreSQL sub-chart (alias: postgres)
# Ref: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
# ------------------------------------------------------------
postgres:
  architecture: standalone
  auth:
    username: dineos
    database: dineos
    # Must equal secrets.postgresPassword — set both to the same value.
    # For prod with secrets.create=false, set auth.existingSecret to the
    # name of your pre-created Secret and auth.secretKeys.userPasswordKey
    # to the key that holds the Postgres password.
    password: ""
    existingSecret: ""
  primary:
    persistence:
      enabled: false

# ------------------------------------------------------------
# Bitnami Redis sub-chart
# Ref: https://github.com/bitnami/charts/tree/main/bitnami/redis
# ------------------------------------------------------------
redis:
  architecture: standalone
  auth:
    # No password in local dev; enable and set password for prod.
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    replicaCount: 0

# ------------------------------------------------------------
# Bitnami RabbitMQ sub-chart
# Ref: https://github.com/bitnami/charts/tree/main/bitnami/rabbitmq
# ------------------------------------------------------------
rabbitmq:
  replicaCount: 1
  auth:
    username: dineos
    # Must equal secrets.rabbitMqPassword — set both to the same value.
    password: ""
    erlangCookie: "dineos-erlang-cookie-change-me"
  persistence:
    enabled: false

# ------------------------------------------------------------
# Codecentric Keycloak sub-chart
# Ref: https://github.com/codecentric/helm-charts/tree/master/charts/keycloak
# ------------------------------------------------------------
keycloak:
  replicas: 1
  # Run in dev mode and auto-import the realm on startup.
  command:
    - /opt/keycloak/bin/kc.sh
    - start-dev
    - --import-realm
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: admin
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HOSTNAME_STRICT
      value: "false"
  # Mount the realm-export.json Secret so --import-realm can find it.
  # The Secret is rendered by templates/keycloak-realm-secret.yaml
  # when dependencies.keycloak.enabled=true.
  extraVolumes: |
    - name: realm-import
      secret:
        secretName: {{ .Release.Name }}-keycloak-realm
  extraVolumeMounts: |
    - name: realm-import
      mountPath: /opt/keycloak/data/import
      readOnly: true
  # Disable the Codecentric sub-chart's bundled Postgres — use the
  # Bitnami postgres sub-chart (or an external DB) instead.
  postgresql:
    enabled: false
  serviceAccount:
    create: false

# ============================================================
# Observability — Prometheus + Alertmanager (in-tree templates)
# All flags default to false so existing prod deploys are
# unaffected. Enable incrementally once the cluster operator
# has confirmed storage and network policies.
# ============================================================
observability:
  prometheus:
    enabled: false
    image: prom/prometheus:v2.55.0
    retention: 15d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      # When true a PersistentVolumeClaim is created for /prometheus.
      # When false an emptyDir is used (data lost on pod restart).
      enabled: true
      size: 10Gi
      # Leave empty to use the cluster default StorageClass.
      storageClass: ""

  alertmanager:
    enabled: false
    image: prom/alertmanager:v0.28.0
    # Name of an existing Kubernetes Secret that contains the Slack
    # incoming-webhook URL under the key "url".
    # Example: kubectl create secret generic alertmanager-slack \
    #            --from-literal=url=https://hooks.slack.com/...
    # Leave empty to start Alertmanager without a Slack receiver.
    slackWebhookSecretName: ""
    # Name of an existing Kubernetes Secret that contains the shared secret
    # for the dineOS backend webhook under the key "secret".
    # Must match AlertWebhook:SharedSecret in the API configuration.
    # Example: kubectl create secret generic alertmanager-webhook \
    #            --from-literal=secret=<random-strong-secret>
    # Leave empty to allow unauthenticated webhook calls on a closed cluster network.
    alertWebhookSecretName: ""

  grafana:
    # Toggle the Prometheus datasource provisioning in Grafana.
    # Only meaningful once observability.prometheus.enabled=true.
    prometheusDatasource:
      enabled: false

  # ── ELK (Elasticsearch + Logstash + Kibana) ──────────────────────────
  # Enable to deploy the full log-aggregation stack in-cluster.
  # When enabled, the API ConfigMap automatically wires Logstash__Uri to
  # the in-cluster Logstash TCP JSON endpoint (port 5001).
  elk:
    enabled: false
    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 2Gi
      persistence:
        enabled: true
        size: 20Gi
        # Leave empty to use the cluster default StorageClass.
        storageClass: ""
    logstash:
      image: docker.elastic.co/logstash/logstash:8.15.0
      # JVM heap, kept at ~50% of the memory limit below so the container has room
      # for Logstash's non-heap memory. Without this, Logstash defaults to a 1g
      # heap that equals the 1Gi limit and the pod is OOMKilled (exit 137).
      javaOpts: "-Xms512m -Xmx512m"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    kibana:
      image: docker.elastic.co/kibana/kibana:8.15.0
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      ingress:
        enabled: false
        className: nginx
        host: kibana.dineos.io
        clusterIssuer: letsencrypt-prod
        tls:
          - hosts:
              - kibana.dineos.io
            secretName: kibana-tls
    # ILM policy delete-after duration applied to indices created by Logstash.
    # Must match the ilm_policy registered on the Elasticsearch node.
    ilm:
      deleteAfter: 7d

  # ── Uptime Kuma (uptime monitor + public status page) ────────────────────
  # Enable to deploy Uptime Kuma in-cluster alongside the observability stack.
  # All monitor definitions and the status page are seeded from the backup JSON
  # at backend/uptime-kuma/kuma-backup.json after the pod is running.
  uptimeKuma:
    enabled: false
    image: louislam/uptime-kuma:1.23.17
    # Must stay at 1 — Uptime Kuma uses SQLite, which does not support concurrent writers.
    replicaCount: 1
    # Name of an existing Kubernetes Secret that contains the Slack
    # incoming-webhook URL under the key "url".
    # Example: kubectl create secret generic kuma-slack \
    #            --from-literal=url=https://hooks.slack.com/...
    # When set, SLACK_WEBHOOK_URL is injected into the pod so that the
    # bootstrap job (backend/uptime-kuma/setup/bootstrap.sh) can seed
    # the Slack notification channel without inlining credentials.
    # Mirrors the alertmanager.slackWebhookSecretName convention.
    slackWebhookSecretName: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    persistence:
      # When true a PersistentVolumeClaim is created for /app/data.
      # When false an emptyDir is used (monitors, history, and notification
      # config are lost on pod restart — do not use in production).
      enabled: true
      size: 1Gi
      # Leave empty to use the cluster default StorageClass.
      storageClass: ""
    ingress:
      enabled: false
      className: nginx
      host: uptime.dineos.io
      clusterIssuer: letsencrypt-prod
      tls:
        - hosts:
            - uptime.dineos.io
          secretName: uptime-kuma-tls
