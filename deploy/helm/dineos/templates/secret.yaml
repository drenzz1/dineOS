{{/*
Chart-managed Secret — gated by secrets.create.

To manage secrets externally (Sealed Secrets, External Secrets Operator,
HashiCorp Vault, etc.):

  1. Set secrets.create=false in your values overlay.
  2. Pre-create a Secret in the same namespace with the keys listed below,
     OR set secrets.existingSecret to the name of your pre-existing Secret.

     The Secret must carry at minimum:
       ConnectionStrings__DefaultConnection
       Keycloak__ClientSecret
       Keycloak__AdminClientSecret
       Keycloak__GoogleClientSecret
       Jwt__SigningKey
       Smtp__Password
       RabbitMq__Password
       Stripe__SecretKey
       Stripe__WebhookSecret
       Anthropic__ApiKey
       OpenAI__ApiKey
       GoogleAI__ApiKey
       AlertWebhook__SharedSecret
       Slack__WebhookUrl

  Example:
    helm upgrade --install dineos ./deploy/helm/dineos \
      --set secrets.create=false \
      --set secrets.existingSecret=dineos-prod-secrets
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dineos.fullname" . }}-secrets
  labels:
    {{- include "dineos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Postgres — full ADO.NET connection string (includes password) ─────
  # Assembled from dependencies.postgres.* + secrets.postgresPassword so
  # the operator only needs to supply the password, not repeat host/db/user.
  ConnectionStrings__DefaultConnection: {{ printf "Host=%s;Port=%v;Database=%s;Username=%s;Password=%s" .Values.dependencies.postgres.host .Values.dependencies.postgres.port .Values.dependencies.postgres.database .Values.dependencies.postgres.username .Values.secrets.postgresPassword | quote }}

  # ── Keycloak ──────────────────────────────────────────────────────────
  # dineos-frontend OIDC client secret (Keycloak__ClientSecret)
  Keycloak__ClientSecret: {{ .Values.secrets.keycloakClientSecret | quote }}
  # dineos-admin service-account secret used by KeycloakAdminClient
  Keycloak__AdminClientSecret: {{ .Values.secrets.keycloakAdminClientSecret | quote }}
  # Confidential client secret for the backend Google authorization-code exchange.
  Keycloak__GoogleClientSecret: {{ .Values.secrets.keycloakGoogleClientSecret | quote }}

  # ── JWT ───────────────────────────────────────────────────────────────
  Jwt__SigningKey: {{ .Values.secrets.jwtSigningKey | quote }}

  # ── SMTP ──────────────────────────────────────────────────────────────
  Smtp__Password: {{ .Values.secrets.smtpPassword | quote }}

  # ── RabbitMQ ──────────────────────────────────────────────────────────
  RabbitMq__Password: {{ .Values.secrets.rabbitMqPassword | quote }}

  # ── Stripe ────────────────────────────────────────────────────────────
  Stripe__SecretKey: {{ .Values.secrets.providerApiKeys.stripe | quote }}
  Stripe__WebhookSecret: {{ .Values.secrets.providerApiKeys.stripeWebhook | quote }}

  # ── AI providers ──────────────────────────────────────────────────────
  Anthropic__ApiKey: {{ .Values.secrets.providerApiKeys.anthropic | quote }}
  OpenAI__ApiKey: {{ .Values.secrets.providerApiKeys.openai | quote }}
  GoogleAI__ApiKey: {{ .Values.secrets.providerApiKeys.googleai | quote }}

  # ── Alerting / AI triage ──────────────────────────────────────────────
  AlertWebhook__SharedSecret: {{ .Values.secrets.alertWebhookSecret | quote }}
  Slack__WebhookUrl: {{ .Values.secrets.slackWebhookUrl | quote }}

  # ── Staff session PIN flow (#216) — HMAC-SHA256 signing key ───────────
  StaffSession__SigningKey: {{ .Values.secrets.staffSessionSigningKey | quote }}

  # ── Feature flags (Unleash, M5.6) — client API token (empty unless enabled) ──
  Unleash__ApiToken: {{ .Values.secrets.unleashApiToken | quote }}
{{- end }}
