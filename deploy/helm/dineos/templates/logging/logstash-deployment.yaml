{{- if .Values.observability.elk.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dineos.fullname" . }}-logstash
  labels:
    {{- include "dineos.labels" . | nindent 4 }}
    app.kubernetes.io/component: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dineos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: logstash
  template:
    metadata:
      labels:
        {{- include "dineos.labels" . | nindent 8 }}
        app.kubernetes.io/component: logstash
    spec:
      serviceAccountName: {{ include "dineos.serviceAccountName" . }}
      containers:
        - name: logstash
          image: {{ .Values.observability.elk.logstash.image }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.observability.elk.logstash.javaOpts }}
          env:
            # Pin the JVM heap below the container memory limit. Logstash defaults
            # to a 1g heap; with a 1Gi limit and no room for its non-heap memory
            # (metaspace, direct buffers, threads) the pod is OOMKilled (exit 137).
            # Keep the heap at roughly 50% of the memory limit set in resources.
            - name: LS_JAVA_OPTS
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: beats
              containerPort: 5044
              protocol: TCP
            - name: tcp-json
              containerPort: 5001
              protocol: TCP
            - name: api
              containerPort: 9600
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.observability.elk.logstash.resources | nindent 12 }}
          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
              readOnly: true
            - name: logstash-pipeline
              # Mount the whole pipeline dir (NOT a subPath file). A subPath mount
              # leaves the image's default /usr/share/logstash/pipeline/logstash.conf
              # in place, and that stock sample also declares a beats input on 5044.
              # Loaded alongside dineos.conf it binds 5044 twice → "Address already
              # in use" → the beats plugin crash-loops every ~6s. Mounting the dir
              # shadows the default file so only dineos.conf loads.
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
      volumes:
        - name: logstash-config
          configMap:
            name: {{ include "dineos.fullname" . }}-logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
        - name: logstash-pipeline
          configMap:
            name: {{ include "dineos.fullname" . }}-logstash-pipeline
            items:
              - key: dineos.conf
                path: dineos.conf
{{- end }}
