apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dineos.fullname" . }}-api
  labels:
    {{- include "dineos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "dineos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dineos.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "dineos.serviceAccountName" . }}
      # Hardened pod security context (clears Trivy KSV-0118). Matches the
      # non-root uid the image already uses (Dockerfile: USER 1001); fsGroup
      # makes the uploads PVC writable when persistence is enabled.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "dineos.fullname" . }}-api-env
            - secretRef:
                name: {{ include "dineos.secretName" . }}
          # Path matches the healthcheck in docker-compose.yml: GET /api/v1/health
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- if dig "uploads" "persistence" "enabled" false .Values.api }}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
{{- end }}
{{- if dig "uploads" "persistence" "enabled" false .Values.api }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "dineos.fullname" . }}-uploads
{{- end }}
