# Helm-template version — processed by tpl in prometheus-configmap.yaml so
# that Helm expressions are resolved at render time. Do NOT embed this file
# with Files.Get alone; it must go through tpl.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: {{ .Release.Name }}
    env: prod

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    {{- if .Values.observability.alertmanager.enabled }}
    - static_configs:
        - targets:
            - {{ include "dineos.fullname" . }}-alertmanager:9093
      timeout: 10s
    {{- end }}

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: dineos-api
    static_configs:
      - targets:
          - {{ include "dineos.fullname" . }}-api:8080
    metrics_path: /metrics

  # Placeholder scrape jobs — uncomment each together with the exporter
  # and enable the matching scrape job in values.yaml:
  #
  # - job_name: node-exporter
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
  #
