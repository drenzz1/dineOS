# =============================================================================
# DineOS — Logstash pipeline
# Inputs  : Serilog / TCP :5001 (json_lines), Nginx / Beats :5044
# Outputs : Elasticsearch — dineos-api-logs-* | dineos-nginx-access-*
# =============================================================================

input {
  # Serilog structured logs from the .NET API
  tcp {
    port  => 5001
    codec => json_lines
    add_field => { "[@metadata][pipeline]" => "serilog" }
  }

  # Nginx access logs shipped by Filebeat
  beats {
    port => 5044
    add_field => { "[@metadata][pipeline]" => "nginx" }
  }
}

filter {
  # ── Serilog (.NET API → TCP :5001) ─────────────────────────────────────────
  if [@metadata][pipeline] == "serilog" {
    # Parse event time from Serilog's Timestamp field
    date {
      match  => ["Timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Promote Properties.* to top-level fields and normalise level casing
    mutate {
      rename => {
        "Level"                       => "level"
        "[Properties][CorrelationId]" => "CorrelationId"
        "[Properties][RequestPath]"   => "RequestPath"
        "[Properties][UserId]"        => "UserId"
        "[Properties][TenantId]"      => "TenantId"
        "[Properties][SourceContext]" => "SourceContext"
        "[Properties][RequestMethod]" => "RequestMethod"
        "[Properties][StatusCode]"    => "StatusCode"
        "[Properties][Elapsed]"       => "Elapsed"
      }
      add_field => { "service" => "dineos-api" }
    }

    # Separate mutate because rename executes before lowercase within one block
    mutate {
      lowercase => ["level"]
    }
  }

  # ── Nginx (Filebeat → Beats :5044) ─────────────────────────────────────────
  else if [@metadata][pipeline] == "nginx" {
    # Matches the dineos_json log_format defined in infra/nginx/nginx.conf.
    # upstream_response_time is quoted (can be "-") so it stays as a string.
    # http_x_request_id carries $request_id — correlates to Serilog's CorrelationId.
    grok {
      match => {
        "message" => '\{"time_iso8601":"%{DATA:time_iso8601}","remote_addr":"%{DATA:remote_addr}","request_method":"%{WORD:request_method}","request_uri":"%{DATA:request_uri}","status":%{NUMBER:status},"body_bytes_sent":%{NUMBER:body_bytes_sent},"request_time":%{NUMBER:request_time},"upstream_response_time":"%{DATA:upstream_response_time}","http_referer":"%{DATA:http_referer}","http_user_agent":"%{DATA:http_user_agent}","http_x_request_id":"%{DATA:http_x_request_id}"\}'
      }
    }

    # Use Nginx's own timestamp instead of Filebeat's ingestion time
    date {
      match        => ["time_iso8601", "ISO8601"]
      target       => "@timestamp"
      remove_field => ["time_iso8601"]
    }

    mutate {
      convert   => {
        "status"          => "integer"
        "body_bytes_sent" => "integer"
        "request_time"    => "float"
      }
      add_field => { "service" => "dineos-nginx" }
    }

    # Nginx logs request_time in seconds (e.g. 0.001 = 1 ms).
    # Derive the integer ms value for histogram buckets; keep request_time as-is.
    ruby {
      code => "event.set('request_time_ms', (event.get('request_time').to_f * 1000).round)"
    }

    geoip {
      source => "remote_addr"
      target => "geo"
    }

    useragent {
      source => "http_user_agent"
      target => "ua"
    }
  }
}

output {
  if [service] == "dineos-api" {
    elasticsearch {
      hosts       => ["http://elasticsearch:9200"]
      index       => "dineos-api-logs-%{+YYYY.MM.dd}"
      ilm_enabled => true
      ilm_policy  => "dineos-logs-ilm-7d"
    }
  } else if [service] == "dineos-nginx" {
    elasticsearch {
      hosts       => ["http://elasticsearch:9200"]
      index       => "dineos-nginx-access-%{+YYYY.MM.dd}"
      ilm_enabled => true
      ilm_policy  => "dineos-logs-ilm-7d"
    }
  }
}
