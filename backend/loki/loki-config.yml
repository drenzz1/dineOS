auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Bound ingestion and retain logs for a finite window so the filesystem store
# does not grow without limit (disk exhaustion -> silent ingestion failure).
limits_config:
  retention_period: 744h            # 31 days
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_line_size: 256KB
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days

# Enforce the retention_period above by actually deleting expired chunks.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  alertmanager_url: http://localhost:9093
