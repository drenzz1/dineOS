services:
  api:
    build:
      context: .
      dockerfile: src/DineOS.Api/Dockerfile
    container_name: dineos-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dineos;Username=dineos;Password=dineos_dev
      - AllowedOrigins__0=http://localhost:3000
      - Keycloak__Authority=http://localhost:8080/realms/dineos
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/dineos/.well-known/openid-configuration
      - Keycloak__Audience=dineos-api
      - Redis__ConnectionString=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - dineos-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: dineos-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - dineos-net

  postgres:
    image: postgres:16-alpine
    container_name: dineos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dineos
      POSTGRES_USER: dineos
      POSTGRES_PASSWORD: dineos_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineos -d dineos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dineos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dineos-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dineos.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - dineos-net
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  dineos-net:
    driver: bridge
