services:
  api:
    build:
      context: .
      dockerfile: src/DineOS.Api/Dockerfile
    image: dineos/api:do2
    container_name: dineos-api
    ports:
      # Bound to loopback so the dev stack is not reachable from the LAN. The
      # frontend (host) reaches it via localhost; containers use the dineos-net bridge.
      - "127.0.0.1:${API_HTTP_PORT:-5001}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dineos;Username=dineos;Password=${POSTGRES_PASSWORD:-dineos_dev}
      - AllowedOrigins__0=http://localhost:3000
      - Keycloak__Realm=dineos
      - Keycloak__Authority=http://localhost:8080/realms/dineos
      - Keycloak__AuthServerUrl=http://keycloak:8080
      - Keycloak__PublicAuthServerUrl=http://localhost:8080
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/dineos/.well-known/openid-configuration
      - Keycloak__Audience=dineos-api
      - Keycloak__ClientId=dineos-frontend
      - Keycloak__GrantType=password
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__AdminClientId=dineos-admin
      - Keycloak__AdminClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET:-dev-admin-secret-change-me}
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Enabled=true
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=dineos
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-dineos_dev}
      - Loki__Uri=http://loki:3100
      - Smtp__Host=mailhog
      - Smtp__Port=1025
      - Smtp__UseStartTls=false
      - Email__Enabled=true
      - Email__FromAddress=no-reply@dineos.local
      - Email__FromName=DineOS
      - Email__SimulateFailure=false
      - Unleash__Enabled=${Unleash__Enabled:-true}
      - Unleash__ApiUrl=${Unleash__ApiUrl:-http://unleash:4242/api/}
      - Unleash__ApiToken=${Unleash__ApiToken:-default:development.unleash-insecure-api-token}
    volumes:
      - dineos_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_healthy
      mailhog:
        condition: service_started
      unleash:
        condition: service_started
    networks:
      - dineos-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: dineos-keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8080"
    command: start-dev --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - dineos-net

  postgres:
    image: postgres:16-alpine
    container_name: dineos-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dineos
      POSTGRES_USER: dineos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dineos_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineos -d dineos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dineos-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dineos-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dineos
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dineos_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: dineos-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dineos-net
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dineos-mailhog
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI — open http://localhost:8025 to inspect delivered mail
    networks:
      - dineos-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: dineos-grafana
    ports:
      - "127.0.0.1:4000:3000"
    environment:
      # Anonymous access defaults to Viewer (read-only) — enough to view the
      # provisioned dashboards in dev without handing out Admin. Set
      # GRAFANA_ANONYMOUS_ENABLED=false (and a real admin password) for prod.
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANONYMOUS_ROLE:-Viewer}
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - dineos-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dineos-pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dineos.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      - postgres
    networks:
      - dineos-net
    restart: unless-stopped
    profiles:
      - tools

  # ── Feature flags (Unleash, M5.6) ───────────────────────────────────────
  # Unleash uses its OWN small Postgres (the shared one is already initialised,
  # no init hook) so flag data stays isolated from app data. Deterministic seeded
  # tokens (client + admin) mean the dev stack needs no manual Unleash setup.
  unleash-db:
    image: postgres:16-alpine
    container_name: dineos-unleash-db
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: ${UNLEASH_DB_PASSWORD:-unleash_dev}
    volumes:
      - unleash_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  unleash:
    image: unleashorg/unleash-server:6
    container_name: dineos-unleash
    depends_on:
      unleash-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UNLEASH_PORT:-4242}:4242"
    environment:
      DATABASE_URL: postgres://unleash:${UNLEASH_DB_PASSWORD:-unleash_dev}@unleash-db:5432/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token"
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-admin-token"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4242/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - dineos-net
    restart: unless-stopped

volumes:
  postgres_data:
  unleash_db_data:
  keycloak_data:
  redis_data:
  rabbitmq_data:
  loki_data:
  grafana_data:
  dineos_uploads:

networks:
  dineos-net:
    driver: bridge
