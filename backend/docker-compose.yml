services:
  api:
    build:
      context: .
      dockerfile: src/DineOS.Api/Dockerfile
    container_name: dineos-api
    ports:
      - "${API_HTTP_PORT:-5001}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dineos;Username=dineos;Password=dineos_dev
      - AllowedOrigins__0=http://localhost:3000
      - Frontend__BaseUrl=http://localhost:3000
      - Keycloak__Realm=dineos
      - Keycloak__Authority=http://localhost:8080/realms/dineos
      - Keycloak__AuthServerUrl=http://keycloak:8080
      - Keycloak__PublicAuthServerUrl=http://localhost:8080
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/dineos/.well-known/openid-configuration
      - Keycloak__Audience=dineos-api
      - Keycloak__ClientId=dineos-frontend
      - Keycloak__GrantType=password
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__AdminClientId=dineos-admin
      - Keycloak__AdminClientSecret=dev-admin-secret-change-me
      - Redis__ConnectionString=redis:6379
      - RabbitMq__Enabled=true
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=dineos
      - RabbitMq__Password=dineos_dev
      - Loki__Uri=http://loki:3100
      - Smtp__Host=mailhog
      - Smtp__Port=1025
      - Smtp__UseStartTls=false
      - Email__Enabled=true
      - Email__FromAddress=no-reply@dineos.local
      - Email__FromName=DineOS
      - Email__SimulateFailure=false
    volumes:
      - dineos_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - dineos-net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: dineos-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - dineos-net

  postgres:
    image: postgres:16-alpine
    container_name: dineos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dineos
      POSTGRES_USER: dineos
      POSTGRES_PASSWORD: dineos_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineos -d dineos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dineos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dineos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dineos
      RABBITMQ_DEFAULT_PASS: dineos_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dineos-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: dineos-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dineos-net
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dineos-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — open http://localhost:8025 to inspect delivered mail
    networks:
      - dineos-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: dineos-grafana
    ports:
      - "4000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - dineos-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dineos-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dineos.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - dineos-net
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  loki_data:
  grafana_data:
  dineos_uploads:

networks:
  dineos-net:
    driver: bridge
