name: Secret Scan

# Repo-wide secret scanning with gitleaks. Runs on every push and pull request.
# On pull requests it scans the PR's commits; on pushes it scans the pushed range.
# fetch-depth: 0 gives gitleaks the full history it needs. Confirmed false
# positives are suppressed by fingerprint in .gitleaksignore at the repo root.
on:
  push:
    branches:
      - main
      - '**'
  pull_request:

permissions:
  contents: read
  # gitleaks-action enumerates the PR's commits via the GitHub API on
  # pull_request events; that call requires pull-requests: read or it 403s
  # with "Resource not accessible by integration".
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write scan summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then BADGE="✅ no secrets detected"; else BADGE="❌ potential secret detected"; fi
          echo "## Secret Scan (gitleaks) — ${BADGE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scans the full git history for committed credentials. Confirmed" >> $GITHUB_STEP_SUMMARY
          echo "false positives are suppressed by fingerprint in \`.gitleaksignore\`." >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
