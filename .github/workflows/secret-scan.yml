name: Secret Scan

# Repo-wide secret scanning with gitleaks, run as the gitleaks CLI in "git" mode.
# Scans the full commit history on every push and pull request and makes NO
# GitHub API calls. (The previous gitleaks/gitleaks-action@v2 enumerated the PR's
# commits via the GitHub API and crashed on large PRs with
# "RequestError [HttpError]: ... Unexpected end of JSON input" before any scan
# ran — see PR #246.) Confirmed false positives are suppressed by commit
# fingerprint in .gitleaksignore at the repo root.
on:
  push:
    branches:
      - main
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit and can match the
          # commit-fingerprint suppressions in .gitleaksignore.
          fetch-depth: 0
      - name: Run gitleaks (full history scan)
        # Pinned image; "git ." scans the repo history and auto-loads
        # .gitleaksignore from the repo root. Exits non-zero only on a real
        # (unsuppressed) finding, which fails the job.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --verbose .
      - name: Write scan summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then BADGE="✅ no secrets detected"; else BADGE="❌ potential secret detected"; fi
          echo "## Secret Scan (gitleaks) — ${BADGE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scans the full git history for committed credentials (gitleaks CLI," >> $GITHUB_STEP_SUMMARY
          echo "git mode — no GitHub API calls). Confirmed false positives are" >> $GITHUB_STEP_SUMMARY
          echo "suppressed by fingerprint in \`.gitleaksignore\`." >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
