name: Lighthouse CI

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Run Lighthouse CI
        working-directory: frontend
        run: npx lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/
          retention-days: 7
      - name: Write summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then BADGE="✅ passed"; else BADGE="⚠️ assertions failed"; fi
          echo "## Lighthouse CI — ${BADGE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Audited public routes: \`/\`, \`/login\`, \`/signup\` (3 runs each, median)." >> $GITHUB_STEP_SUMMARY
          echo "Assertions: accessibility ≥ 0.90 (error); performance/best-practices/SEO ≥ 0.80–0.90 (warn)." >> $GITHUB_STEP_SUMMARY
          echo "Full reports: \`lighthouse-reports\` artifact (7-day retention)." >> $GITHUB_STEP_SUMMARY
