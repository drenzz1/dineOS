name: Observability CI

# Validates Prometheus config, alert rules, Alertmanager config, and Logstash
# pipeline whenever the backend observability files or their Helm equivalents change.
on:
  push:
    paths:
      - 'backend/prometheus/**'
      - 'backend/elk/logstash/**'
      - 'deploy/helm/dineos/files/prometheus/**'
      - 'deploy/helm/dineos/files/logging/**'
      - '.github/workflows/observability.yml'
  pull_request:
    paths:
      - 'backend/prometheus/**'
      - 'backend/elk/logstash/**'
      - 'deploy/helm/dineos/files/prometheus/**'
      - 'deploy/helm/dineos/files/logging/**'
      - '.github/workflows/observability.yml'

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promtool-lint:
    name: promtool / amtool check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mount backend/prometheus at /etc/prometheus so the rule_files glob
      # in prometheus.yml (/etc/prometheus/rules/*.rules.yml) resolves to the
      # actual rule files without needing to patch the config for CI.
      - name: Check Prometheus config (promtool check config)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.55.0 \
            check config /etc/prometheus/prometheus.yml

      # Run rules check separately so a rule-file error is reported
      # independently from a config-structure error.
      - name: Check Prometheus alert rules (promtool check rules)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend/prometheus/rules:/rules:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.55.0 \
            check rules \
              /rules/api.rules.yml \
              /rules/infra.rules.yml

      # alertmanager.yml uses ${SLACK_WEBHOOK_URL} and ${ALERT_WEBHOOK_SECRET},
      # substituted at runtime by the alertmanager entrypoint (compose) /
      # initContainer (Helm). amtool does not perform
      # env expansion, so we substitute syntactically valid dummy values before
      # running the check. The sed pattern uses single quotes so the shell does
      # not expand the variables — sed sees the literal strings.
      - name: Check Alertmanager config (amtool check-config)
        run: |
          sed \
            -e "s|\${SLACK_WEBHOOK_URL}|https://hooks.slack.com/services/ci-dummy|g" \
            -e "s|\${ALERT_WEBHOOK_SECRET}|ci-dummy-secret|g" \
            backend/prometheus/alertmanager.yml \
            > /tmp/alertmanager-ci.yml
          docker run --rm \
            -v /tmp/alertmanager-ci.yml:/etc/alertmanager/alertmanager.yml:ro \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.28.0 \
            check-config /etc/alertmanager/alertmanager.yml

  logstash-lint:
    name: Logstash pipeline syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mount the Logstash pipeline directory and run logstash -t (config test)
      # which parses the pipeline and exits 0 on success, non-zero on error.
      # The -f flag points to the specific pipeline file.
      # Same Docker image version as docker-compose.yml (8.15.0).
      # Only the backend/elk/ copy is linted — the Helm copy
      # (files/logging/pipeline/dineos.conf) contains {{ include ... }}
      # template expressions that are not valid Logstash until rendered.
      - name: Check Logstash pipeline (logstash -t)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend/elk/logstash/pipeline:/cfg:ro" \
            docker.elastic.co/logstash/logstash:8.15.0 \
            logstash -t -f /cfg/dineos.conf
